    if (palMatches.length) palInput.setAttribute('aria-activedescendant', `pal-${palActive}`);
    else palInput.removeAttribute('aria-activedescendant');
    const active = palList.querySelector('[aria-selected="true"]');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  function openPalette() {
    if (palette.open) return;
    palInput.value = '';
    palActive = 0;
    palRender();
    palette.showModal();
    palInput.focus();
  }
  function openPage(id) {
    palette.close();
    if (location.hash.replace('#', '') === id) return;
    location.hash = id;
  }
  palInput.addEventListener('input', () => { palActive = 0; palRender(); });
  palInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!palMatches.length) return;
      palActive = (palActive + (e.key === 'ArrowDown' ? 1 : -1) + palMatches.length) % palMatches.length;
      palRender();
    } else if (e.key === 'Enter' && palMatches[palActive]) {
      e.preventDefault();
      openPage(palMatches[palActive].id);
    }
  });
  palList.addEventListener('click', (e) => {
    const li = e.target.closest('[data-page]');
    if (li) openPage(li.dataset.page);
  });
  palette.addEventListener('click', (e) => { if (e.target === palette) palette.close(); });
  document.getElementById('open-palette').addEventListener('click', openPalette);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (palette.open) palette.close();
      else openPalette();
    } else if (e.key === '/' && !palette.open && !isTyping(e.target)) {
      e.preventDefault();
      openPalette();
    }
  });

  function vizPage(scene) {
    const { prev, next } = neighbors(scene.id);
    main.innerHTML = `
      <div class="page">
        <header class="viz-head">
          <span class="eyebrow">${esc(scene.subpath)}</span>
          <h1>${esc(scene.name)}</h1>
          <p>${esc(scene.use)}</p>
        </header>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Version">
            <button type="button" data-mode="quorin" aria-pressed="true">With quorin</button>
            <button type="button" data-mode="naive" aria-pressed="false">Naive version</button>
          </div>
          <a class="doclink" href="${DOCS}${scene.doc}">Read the docs</a>
        </div>
        <div class="stage-card">
          <div data-stage></div>
          <div class="legend-row">${scene.legend.map(([c, l]) => `<span><i style="background:var(--${c})"></i>${esc(l)}</span>`).join('')}<span class="keys"><kbd>Space</kbd> play <kbd>←</kbd><kbd>→</kbd> step <kbd>[</kbd><kbd>]</kbd> page</span></div>
          <div class="controls">
            <button class="btn" type="button" data-play aria-pressed="false">Play</button>
            <button class="btn" type="button" data-back aria-label="Step back">Back</button>
            <button class="btn" type="button" data-step aria-label="Step forward">Step</button>
            <button class="btn" type="button" data-reset>Reset</button>
            <span class="progress" data-progress></span>
            <span class="spacer"></span>
            <label for="param-${scene.id}">${esc(scene.param.label)}
              <input id="param-${scene.id}" type="range" min="${scene.param.min}" max="${scene.param.max}" step="1" value="${scene.param.value}" data-param>
              <output data-param-out>${scene.param.value}</output>
            </label>
            <label for="speed-${scene.id}">Speed
              <select id="speed-${scene.id}" data-speed><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
            </label>
          </div>
        </div>
        <div class="panels">
          <pre class="code" data-code aria-label="Code"></pre>
          <div class="side-panel">
            <div class="box"><h3>What is happening</h3><ol class="log" data-log aria-live="polite"></ol></div>
            <div class="box"><h3>What to notice</h3><ul class="notice" data-notice></ul></div>
          </div>
        </div>
        <nav class="pager" aria-label="More visualizers">
          <a class="prev" href="#${prev.id}" rel="prev"><small>Previous · ${esc(prev.label)}</small><code>${esc(prev.name)}</code></a>
          <a class="next" href="#${next.id}" rel="next"><small>Next · ${esc(next.label)}</small><code>${esc(next.name)}</code></a>
        </nav>
      </div>`;
    return createPlayer(main.firstElementChild, scene);
  }

  let firstRoute = true;
  function route() {
    const id = location.hash.replace('#', '') || 'overview';
    const swap = () => {
      if (current) current.destroy();
      current = null;
      const scene = BY_ID[id];
      renderNav(scene ? id : 'overview');
      current = scene ? vizPage(scene) : overview();
      window.scrollTo(0, 0);
    };
    if (!firstRoute && document.startViewTransition && !reduceMotion) document.startViewTransition(swap);
    else swap();
    firstRoute = false;
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
